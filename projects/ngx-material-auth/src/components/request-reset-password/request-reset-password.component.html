<div class="mat-elevation-z8 request-reset-password-box">
    <h1>{{requestResetPasswordTitle}}</h1>
    <form #formControl="ngForm" (ngSubmit)="onSubmit(formControl)">
        <mat-form-field>
            <mat-label>{{emailInputLabel}}</mat-label>
            <input #mail="ngModel" matInput type="email" name="email" required email [(ngModel)]="email">
            <!-- eslint-disable-next-line angular/no-call-expression -->
            <mat-error *ngIf="mail.errors">{{getValidationErrorMessage(mail)}}</mat-error>
        </mat-form-field>
        <br>
        <div class="buttons-row">
            <button mat-raised-button type="submit" [disabled]="formControl.invalid">
                {{sendEmailButtonLabel}}
            </button>
            <button mat-raised-button type="button" (click)="cancel()">
                {{cancelButtonLabel}}
            </button>
        </div>
    </form>
</div>
