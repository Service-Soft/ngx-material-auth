<div class="code-container">
    <input matInput
        id="code1"
        minlength="1"
        maxlength="1"
        pattern="[0-9]"
        oninput="validity.valid || (value='');"
       
        [class.valid]="one"
        [(ngModel)]="one"
        (keyup)="keyup($event, 1)"
        (focus)="focused(1)"
        (paste)="paste($event)"
    >
